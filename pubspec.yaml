name: kids_drawing_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
dependencies:
  intl: ^0.20.2
  provider: ^6.1.2
  flutter_svg: ^2.2.3
  native_device_orientation: ^2.0.3
  flutter:
    sdk: flutter
    

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  floor: ^1.5.0
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  gal: ^3.0.0
  package_info_plus: ^10.2.2
  flutter_soloud: ^5.3.1
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.4
  workmanager: ^0.5.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  floor_generator: ^1.5.0
  build_runner: ^2.4.13

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/png/
    - assets/ui/
    - assets/svgs/
    - assets/gallery/
    - assets/brushes/
    - assets/stationary/marker/
    - assets/stationary/glitter/
    - assets/stationary/pencil/
    - assets/stationary/brush/
    - assets/stationary/crayon/
    - assets/stationary/spray/
    - assets/stationary/watercolor/
    - assets/stationary/color-balls/
    - assets/stationary/tape/
    - assets/stationary/tape/patterns/
    - assets/stationary/letters/
    - assets/genre/live_background/
    - assets/sounds/ui/
    - assets/sounds/draw/
    - assets/sounds/ambience/
    - assets/sounds/music/
    - assets/voice/
    - assets/voice/en/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/google_sans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf
